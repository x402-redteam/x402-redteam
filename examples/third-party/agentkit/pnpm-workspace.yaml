# Standalone project, deliberately outside the harness's pnpm workspace (U25 §3.2).
# Having its own pnpm-workspace.yaml stops pnpm from adopting the repo root's workspace.
packages: []
minimumReleaseAge: 4320
overrides:
  "@x402/core": 2.28.0
  "@x402/evm": 2.28.0
  "@x402/fetch": 2.28.0
  "@x402/svm": 2.28.0
  # The capture shim's own workspace:* dependency, resolved from the same checkout.
  "@x402-redteam/schema": file:../../../packages/schema
  # Patched versions of vulnerable transitive dependencies (Dependabot, U27). Only the
  # affected ranges are moved. elliptic and bigint-buffer have no patched release yet.
  # These live here, not in package.json: pnpm 10 ignores this file's overrides when
  # package.json has its own `pnpm.overrides`.
  "ws@>=8.0.0 <8.21.0": 8.22.0
  "uuid@<11.1.1": 11.1.1
  "stream-json@<3.6.0": 3.6.0
  "decode-uri-component@<0.5.0": 0.5.0
  "bn.js@<4.12.3": 4.12.5
