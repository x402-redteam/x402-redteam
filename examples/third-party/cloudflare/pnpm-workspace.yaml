# Standalone project, deliberately outside the harness's pnpm workspace (U25 §3.2, U33 §3.1).
# Having its own pnpm-workspace.yaml stops pnpm from adopting the repo root's workspace.
# Lifecycle scripts stay off: no `onlyBuiltDependencies`, and one runtime dependency of the
# package under test has an install script (esbuild) that must never run.
packages: []
minimumReleaseAge: 4320
overrides:
  # The schema package's own workspace dependencies, resolved from the same checkout.
  "@x402-redteam/schema": file:../../../packages/schema
  # The MCP SDK and zod at the versions the repo root pins, whatever a dependent asks for.
  "@modelcontextprotocol/sdk": 1.32.1
  "zod@>=4.0.0 <4.6.6": 4.6.7
