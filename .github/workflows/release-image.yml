name: release-image

# ADR-023: builds the ranked container image once per release from
# .github/ranked/Dockerfile, pushes it to GHCR, and attests its digest. release.yml calls
# this workflow after the GitHub Release is published; it never runs on its own.
#
# - linux/amd64 only (the runners and the age tarball the image installs are amd64).
# - BuildKit attaches an SBOM and max-mode provenance to the pushed image index.
# - actions/attest signs the image digest with this workflow's identity and pushes the
#   attestation to the registry, so `gh attestation verify oci://IMAGE@DIGEST
#   --signer-workflow <org>/x402-redteam/.github/workflows/release-image.yml` succeeds.
# - The harness commit is baked in through the HARNESS_COMMIT build arg (the caller's
#   commit, which is the release commit), so ranked reports carry it as harness_commit.
# - No environment of its own: release.yml calls it only after its approved `release`
#   job, so a release needs one approval.
# - Tags: vX.Y.Z, vX.Y and vX; never `latest`. Ranked workflows ignore tags and pull by
#   the digest recorded in results/_harness.json.
# - No build cache, so a release build never consumes state another workflow wrote.
on:
  workflow_call:
    inputs:
      version:
        description: Release version, X.Y.Z (a leading v is accepted)
        required: true
        type: string
    outputs:
      image:
        description: Image name, ghcr.io/x402-redteam/x402-redteam-ranked
        value: ${{ jobs.image.outputs.image }}
      digest:
        description: Pushed image digest, sha256:<64 hex>
        value: ${{ jobs.image.outputs.digest }}

permissions: {}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Validate the version and derive the image name
        id: name
        env:
          VERSION: ${{ inputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          version="${VERSION#v}"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version '$VERSION' is not X.Y.Z"
            exit 2
          fi
          # GHCR image names are lowercase.
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          {
            echo "version=$version"
            echo "image=ghcr.io/$owner/x402-redteam-ranked"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive the image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern=v{{version}},value=${{ steps.name.outputs.version }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ steps.name.outputs.version }}
            type=semver,pattern=v{{major}},value=${{ steps.name.outputs.version }}

      - name: Build and push the ranked image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .github/ranked/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            HARNESS_COMMIT=${{ github.sha }}
            IMAGE_VERSION=v${{ steps.name.outputs.version }}
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
          sbom: true
          provenance: mode=max

      - name: Attest the image digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record the digest in the job summary
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.name.outputs.version }}
          HARNESS_COMMIT: ${{ github.sha }}
        run: |
          {
            echo "### Ranked image v$VERSION"
            echo
            echo "- image: \`$IMAGE@$DIGEST\`"
            echo "- harness commit: \`$HARNESS_COMMIT\`"
            echo
            echo "results/_harness.json entry:"
            echo
            echo '```json'
            printf '{"commit": "%s", "version": "v%s", "image": "%s"}\n' "$HARNESS_COMMIT" "$VERSION" "$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
