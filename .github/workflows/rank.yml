name: rank

# ADR-010/ADR-011 (U19), Tier 2 "Verified (public corpus)": a reusable workflow a
# submitter's own public repo calls (`uses:
# x402-redteam/x402-redteam/.github/workflows/rank.yml@<release tag>` — see
# docs/seasons.md for the org placeholder) to run the canonical guardrail-track config
# against the PUBLIC corpus, under this harness's own CI identity, and attest
# `report.json`. The leaderboard (`pnpm leaderboard`) checks that attestation
# (`--verify-attestations`) plus every U13/U16 acceptance check before showing the
# result in the "Verified (public corpus)" table — never merged into Tier 1's ranked
# table (ADR-011).
#
# Security review HIGH-3:
# - `harness-repo` is gone as an input — the harness's own org/repo is named exactly
#   once below (`HARNESS_REPO`, an env var on the `run` job), matching
#   `provenance.ts`'s `HARNESS_ORG_REPO` constant (checked by
#   `packages/cli/test/ranked-workflows.test.ts`).
# - every `${{ inputs.* }}` value is passed through `env:`, never interpolated
#   directly into a `run:` shell script — a crafted `guardrail-cmd` or `guardrail-id`
#   string can't break out of its intended single value this way.
# - the guardrail itself runs inside the same container image `ranked-run.yml` uses
#   (ADR-023: the release image built by `release-image.yml`, resolved from the harness
#   repo's `results/_harness.json`, its attestation verified, and pulled by digest),
#   under a non-runner uid (`--agent-uid 2001`), with a root-owned output directory —
#   the runner's own filesystem never sees the guardrail's writes except the final
#   `report.json` this job copies out.
# - attestation happens in a **separate** job (`attest`), the only one with
#   `id-token: write`/`attestations: write` — `run` itself never holds those
#   permissions, so a compromised guardrail command can't forge its own attestation.
#   Besides the provenance attestation, `attest` signs a second statement over the same
#   `report.json` whose predicate names the image digest and harness commit that ran.
#
# NOT verified live (CLAUDE.md: no `act`/actionlint/docker, no network from this
# worktree) — statically authored and YAML-checked only. Dry-run once a real org/repo
# exists.
on:
  workflow_call:
    inputs:
      # Security re-review 3c: a release tag only (vMAJOR.MINOR.PATCH) - never a raw
      # commit SHA or a branch. A tag is the thing `results/_harness.json`'s allowlist
      # and this harness's own release process both reason about.
      harness-ref:
        description: x402-redteam release tag to run, vMAJOR.MINOR.PATCH (never a commit SHA or branch)
        required: true
        type: string
      guardrail-cmd:
        description: Shell command that starts the GDP guardrail under test (ADR-010)
        required: true
        type: string
      guardrail-id:
        description: Stable id recorded in report.json and shown on the leaderboard
        required: true
        type: string

permissions:
  contents: read # checkouts of the submitter's repo and the harness

jobs:
  run:
    name: run
    runs-on: ubuntu-latest
    timeout-minutes: 90 # U34 (A8): a fixed ceiling, not derived from a local run; U36-c: 30 -> 90 for 3 passes (a nondeterministic guardrail; 2 for a deterministic one)
    permissions:
      contents: read # checkouts of the submitter's repo, the harness and its allowlist
    env:
      HARNESS_REPO: x402-redteam/x402-redteam
      RANKED_IMAGE: ghcr.io/x402-redteam/x402-redteam-ranked
    outputs:
      guardrail-id: ${{ inputs.guardrail-id }}
      ranked-image: ${{ steps.resolve.outputs.ranked-image }}
      harness-commit: ${{ steps.resolve.outputs.harness-commit }}
      # U34 (H1): written only by this job's own steps, so the caller workflow cannot set
      # them. `attest` downloads this exact artifact id and checks this exact digest.
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      report-sha256: ${{ steps.report.outputs.report-sha256 }}
    steps:
      # Security re-review 3c: harness-ref must be a vX.Y.Z release tag - never a raw
      # commit SHA or a branch (unlike ranked-run.yml's harness-ref/guardrail-ref,
      # which may also be a 40-hex SHA for a guardrail still awaiting its own tag).
      - name: Validate harness-ref is a vMAJOR.MINOR.PATCH release tag and guardrail-id is a valid id
        env:
          HARNESS_REF: ${{ inputs.harness-ref }}
          GUARDRAIL_ID: ${{ inputs.guardrail-id }}
        run: |
          if ! printf '%s' "$HARNESS_REF" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::harness-ref '$HARNESS_REF' is not a vMAJOR.MINOR.PATCH release tag"
            exit 2
          fi
          # U27: the id the report records (as --guardrail-id and --agent-id) must be one the
          # leaderboard accepts (RESULT_ID_PATTERN in @x402-redteam/schema). bash's =~
          # matches the whole value, so an id with a line break never passes.
          export LC_ALL=C
          id_pattern='^[a-z0-9][a-z0-9._-]{0,63}$'
          if ! [[ "$GUARDRAIL_ID" =~ $id_pattern ]]; then
            echo "::error::guardrail-id is not a valid id (must match $id_pattern)"
            exit 2
          fi

      # The caller's own repo (where guardrail-cmd's code lives). persist-credentials:
      # false (security review LOW) - this job never needs to push or re-authenticate.
      - name: Checkout the submitter's repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout the x402-redteam harness at a pinned ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: x402-redteam/x402-redteam
          ref: ${{ inputs.harness-ref }}
          path: .x402-redteam-harness
          persist-credentials: false
          # Security re-review 3c: fetch the tag's own ref too, so the next step can
          # resolve `refs/tags/<tag>^{commit}` independently of whatever `ref:` above
          # actually resolved to (defense against a same-named branch shadowing the
          # tag - checkout always fetches by ref name, which is ambiguous when both
          # exist).
          fetch-tags: true

      - name: Assert the checked-out HEAD is really that tag's own commit
        env:
          HARNESS_REF: ${{ inputs.harness-ref }}
        run: |
          actual="$(git -C .x402-redteam-harness rev-parse HEAD)"
          expected="$(git -C .x402-redteam-harness rev-parse "refs/tags/$HARNESS_REF^{commit}")"
          if [ "$actual" != "$expected" ]; then
            echo "::error::checked-out HEAD ($actual) does not match tag $HARNESS_REF's own commit ($expected) - refusing to run (possible branch/tag name collision)"
            exit 2
          fi
          # Recorded via GITHUB_ENV (read back by later steps as a plain environment
          # variable - never spliced into a run: block as a GitHub expression): the
          # resolver below requires the allowlisted release to name this same commit,
          # and the attestation check requires the image to have been built from it.
          echo "HARNESS_COMMIT=$actual" >> "$GITHUB_ENV"

      # The release allowlist lives on the harness repo's default branch: a release's
      # image digest is recorded there after the release tag already exists. Only the
      # data file comes from there; the resolver runs from the verified tag checkout.
      - name: Checkout the harness release allowlist
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: x402-redteam/x402-redteam
          path: .x402-redteam-allowlist
          persist-credentials: false
          sparse-checkout: |
            results/_harness.json
          sparse-checkout-cone-mode: false

      - name: Resolve the ranked image digest for harness-ref
        id: resolve
        env:
          HARNESS_REF: ${{ inputs.harness-ref }}
          HARNESS_JSON: .x402-redteam-allowlist/results/_harness.json
        run: |
          digest="$(node .x402-redteam-harness/scripts/ranked/resolve-image.mjs)"
          echo "RANKED_IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          {
            echo "ranked-image=$RANKED_IMAGE@$digest"
            echo "harness-commit=$HARNESS_COMMIT"
          } >> "$GITHUB_OUTPUT"

      # The image must carry an attestation signed by this harness's release-image.yml at
      # the commit checked out above, from a run on main, on a GitHub-hosted runner. The
      # bundle is read from the registry, where release-image.yml pushed it.
      - name: Verify the ranked image attestation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: refs/heads/main
        run: |
          gh attestation verify "oci://$RANKED_IMAGE@$RANKED_IMAGE_DIGEST" \
            --bundle-from-oci \
            --repo "$HARNESS_REPO" \
            --signer-workflow "$HARNESS_REPO/.github/workflows/release-image.yml" \
            --signer-digest "$HARNESS_COMMIT" \
            --source-digest "$HARNESS_COMMIT" \
            --source-ref "$RELEASE_REF" \
            --deny-self-hosted-runners

      - name: Pull the ranked image by digest
        run: docker pull "$RANKED_IMAGE@$RANKED_IMAGE_DIGEST"

      # Security review HIGH-3: guardrail-cmd/guardrail-id reach the container only via
      # `-e` (the container's own env), never spliced into this script's text. The
      # guardrail runs as uid 2001 (never the runner's own uid, never root); /out is
      # root-owned inside the container and only copied to the runner's filesystem
      # (chmod'd back to the runner's own user) after the harness process exits.
      - name: Run the canonical guardrail-track config against the public corpus
        env:
          GUARDRAIL_CMD: ${{ inputs.guardrail-cmd }}
          GUARDRAIL_ID: ${{ inputs.guardrail-id }}
          # Security re-review 3b nit: moved into env: alongside the inputs above,
          # even though github.repository/github.sha aren't attacker-controlled.
          GUARDRAIL_REPO_REF: ${{ github.repository }}@${{ github.sha }}
        run: |
          # U34 (M6) hardening, identical in rank.yml and ranked-run.yml: no network, only the
          # capabilities the harness needs as root (CHOWN: per-run HOME/task/GDP dirs;
          # SETUID/SETGID: dropping to --agent-uid; KILL: kill(-pid) and pkill -u 2001;
          # DAC_OVERRIDE: reading/removing 0700 dirs owned by uid 2001 and writing into the
          # runner-owned /out), no privilege gain, bounded pids/memory, a read-only root
          # filesystem with tmpfs for the three paths that are written. /root-out and
          # /corpus are 0700 so the agent uid cannot read them (tmpfs defaults to 1777).
          mkdir -p "$RUNNER_TEMP/out"
          docker run --rm \
            --network none \
            --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID --cap-add KILL --cap-add DAC_OVERRIDE \
            --security-opt no-new-privileges \
            --pids-limit 512 --memory 4g --memory-swap 4g \
            --read-only \
            --tmpfs /tmp:rw,size=1g --tmpfs /root-out:rw,mode=0700,size=256m --tmpfs /corpus:rw,mode=0700,size=256m \
            -e GUARDRAIL_CMD \
            -e GUARDRAIL_ID \
            -e GUARDRAIL_REPO_REF \
            -v "$PWD:/workspace:ro" \
            -v "$RUNNER_TEMP/out:/out" \
            -w /workspace \
            "$RANKED_IMAGE@$RANKED_IMAGE_DIGEST" \
            --agent-uid 2001 \
            --guardrail "$GUARDRAIL_CMD" \
            --guardrail-id "$GUARDRAIL_ID" \
            --agent-id "$GUARDRAIL_ID" \
            --guardrail-repo-ref "$GUARDRAIL_REPO_REF"
          # entrypoint.sh (HIGH-4) writes to a root-only internal dir and copies the
          # finished report.json to /out itself, with the copy's own permissions set -
          # this just reconciles /out's ownership back to the runner's own user so the
          # upload-artifact step below can read it.
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/out"

      # U34 (H1): refuse a missing, symlinked or non-regular report, then record its
      # sha256 as a job output. The container has exited and ownership is reconciled, so
      # nothing but this job's own steps can change the file before the upload below.
      - name: Check report.json and record its sha256
        id: report
        run: |
          report="$RUNNER_TEMP/out/report.json"
          if [ -L "$report" ] || [ ! -f "$report" ]; then
            echo "::error::report.json is missing, a symlink or not a regular file"
            exit 2
          fi
          sum="$(sha256sum "$report" | cut -d' ' -f1)"
          if ! printf '%s' "$sum" | grep -qE '^[0-9a-f]{64}$'; then
            echo "::error::could not compute the sha256 of report.json"
            exit 2
          fi
          echo "report-sha256=$sum" >> "$GITHUB_OUTPUT"

      - name: Upload report.json
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-${{ inputs.guardrail-id }}
          path: ${{ runner.temp }}/out/report.json
          retention-days: 90

  # Security review HIGH-3: the ONLY job with id-token/attestations permissions - it
  # never runs the guardrail itself, only consumes `run`'s uploaded artifact.
  attest:
    name: attest
    needs: run
    runs-on: ubuntu-latest
    permissions:
      contents: read # kept explicit; the job reads only the uploaded artifact
      id-token: write # OIDC token that Sigstore signs the attestations with
      attestations: write # store the attestations on this repository
    steps:
      # U34 (H1, C5): download by the artifact id `run` uploaded (never by name), then
      # check the bytes against the sha256 `run` computed BEFORE any attestation step.
      - name: Download report.json
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.run.outputs.artifact-id }}
          merge-multiple: true
          path: out

      - name: Check the downloaded report against the run job's sha256
        env:
          EXPECTED_SHA256: ${{ needs.run.outputs.report-sha256 }}
        run: |
          if ! printf '%s' "$EXPECTED_SHA256" | grep -qE '^[0-9a-f]{64}$'; then
            echo "::error::the run job's report sha256 '$EXPECTED_SHA256' is not 64 hex chars"
            exit 2
          fi
          if [ -L out/report.json ] || [ ! -f out/report.json ]; then
            echo "::error::out/report.json is missing, a symlink or not a regular file"
            exit 2
          fi
          printf '%s  %s\n' "$EXPECTED_SHA256" out/report.json | sha256sum -c -

      - name: Attest report.json provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/report.json

      - name: Write the ranked image predicate
        env:
          RANKED_IMAGE_REF: ${{ needs.run.outputs.ranked-image }}
          HARNESS_COMMIT: ${{ needs.run.outputs.harness-commit }}
          REPORT_SHA256: ${{ needs.run.outputs.report-sha256 }}
        run: |
          if ! printf '%s' "$RANKED_IMAGE_REF" | grep -qE '^ghcr\.io/[^@]+@sha256:[0-9a-f]{64}$'; then
            echo "::error::ranked image reference '$RANKED_IMAGE_REF' is not pinned by digest"
            exit 2
          fi
          if ! printf '%s' "$HARNESS_COMMIT" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::harness commit '$HARNESS_COMMIT' is not a 40-hex-char commit SHA"
            exit 2
          fi
          jq -n --arg image "$RANKED_IMAGE_REF" --arg commit "$HARNESS_COMMIT" --arg sha "$REPORT_SHA256" \
            '{image: $image, harness_commit: $commit, report_sha256: $sha}' > ranked-image.json

      - name: Attest which image produced report.json
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/report.json
          predicate-type: https://github.com/x402-redteam/x402-redteam/blob/main/docs/seasons.md#which-image-ran-this-result
          predicate-path: ranked-image.json
