name: CI

# ADR-018: one required check, `ci-ok`. Every pull request runs the fast gate; the E2E
# shards and the self-test matrix run when a runtime path changes (see the `changes` job).
# A push to main runs everything. release.yml calls this workflow (workflow_call) to gate
# the release commit; that call sees the caller's push event, so it also runs everything.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions: {}

# Pull requests share a group per ref, so a new commit cancels the previous run. Each push
# to main gets its own group (its sha) and is never cancelled. github.workflow is the
# calling workflow's name, so the run release.yml calls never shares a group with the
# normal push run of the same commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Decides whether the heavy suites run. Pull requests diff their merge commit against
  # the base commit and classify the paths with scripts/ci-changes.mjs; pushes and manual
  # runs always run everything. If the diff can't be computed, everything runs.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      runtime: ${{ steps.classify.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Classify changed paths
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames lists a rename as delete + add, so a file moved out of a runtime
          # path still reports that path.
          if ! files=$(git -c core.quotePath=false diff --no-renames --name-only "$BASE" "$HEAD"); then
            echo "::warning::git diff failed; running every suite"
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$files" | node scripts/ci-changes.mjs >> "$GITHUB_OUTPUT"

  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit tests with coverage thresholds
        run: pnpm test:coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "::error::coverage/coverage-summary.json was not written"
            exit 1
          fi
          node -e "
            const t = require('./coverage/coverage-summary.json').total;
            if (t.statements.total === 0) {
              console.error('::error::coverage measured 0 statements; the include globs match nothing');
              process.exit(1);
            }
            const rows = ['statements', 'branches', 'functions', 'lines']
              .map((k) => '| ' + k + ' | ' + t[k].pct + '% | ' + t[k].covered + '/' + t[k].total + ' |');
            console.log(['### Coverage', '', '| metric | % | covered |', '|---|---|---|', ...rows].join('\n'));
          " >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm leaderboard
      - name: Ensure LEADERBOARD.md is committed and up to date
        run: git diff --exit-code LEADERBOARD.md
      # Proves every package compiles with its build config. Runs last: the dist/ output
      # is gitignored and the checkout is discarded with the runner.
      - name: Build every package
        run: pnpm -r build

  # Real-runner-checklist.md item 2 (ADR-012 full §3): proves `*.localhost` actually
  # resolves on ubuntu-latest, the way `packages/cli/src/host-env.ts`'s
  # `preflightHostMode` and this repo's Python agent both rely on, via three independent
  # resolvers plus the real `preflightHostMode("localhost")` function itself, so a pass
  # here can't be an artifact of just one resolver having its own fallback path. ADR-012
  # (full) §3 notes `*.localhost` was only verified on macOS/Node 20/Python before this
  # job existed - this is that verification, for real, on the runner this harness
  # actually ships Actions on. If any step fails: `host_mode: localhost` cannot be the
  # canonical default on ubuntu-latest runners - stop and escalate to the architect
  # (ADR-012's proxy-mode fallback, or an `/etc/hosts` step added to this action, per
  # real-runner-checklist.md item 2).
  host-resolution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - run: pnpm install --frozen-lockfile

      - name: getent hosts x402rt-probe.localhost (glibc NSS resolution)
        run: getent hosts x402rt-probe.localhost

      - name: node dns.lookup('x402rt-probe.localhost') resolves to a loopback address
        run: |
          node -e "
            require('node:dns').lookup('x402rt-probe.localhost', (err, address, family) => {
              if (err) { console.error(err); process.exit(1); }
              console.log('node dns.lookup ->', address, 'IPv' + family);
              if (address !== '127.0.0.1' && address !== '::1') {
                console.error('expected a loopback address (127.0.0.1 or ::1), got', address);
                process.exit(1);
              }
            });
          "

      - name: python socket.getaddrinfo('x402rt-probe.localhost') resolves to a loopback address
        run: |
          python3 -c "
          import socket
          results = socket.getaddrinfo('x402rt-probe.localhost', 80)
          print('python getaddrinfo ->', results)
          addrs = {r[4][0] for r in results}
          assert addrs and addrs <= {'127.0.0.1', '::1'}, f'expected only loopback addresses, got {addrs}'
          "

      # The three checks above prove DNS resolution; this proves the CLI's own
      # fallback logic (packages/cli/src/host-env.ts) actually takes the localhost
      # path end-to-end on this runner, rather than silently (if quietly logged)
      # falling back to "path" - which is the one failure mode the three checks above
      # can't see on their own (they never exercise a real loopback HTTP round trip).
      - name: preflightHostMode("localhost") must not fall back to "path"
        run: |
          cat > .ci-preflight-check.mts <<'EOF'
          import { preflightHostMode } from "./packages/cli/src/host-env.js";

          const mode = await preflightHostMode("localhost");
          if (mode !== "localhost") {
            console.error(
              `preflightHostMode("localhost") returned "${mode}" - *.localhost is not usable end-to-end on this runner`,
            );
            process.exit(1);
          }
          console.log('preflightHostMode("localhost") -> "localhost" (OK)');
          EOF
          pnpm exec tsx .ci-preflight-check.mts
          rm -f .ci-preflight-check.mts

  # Spawns real agents per scenario x chain against the full corpus; slow, so these run
  # as their own job, sharded by e2e test file (real-runner-checklist.md item 3) rather
  # than one long `pnpm test:e2e` invocation - each shard carries this job's full 60-minute
  # budget independently, so as the corpus (and the E2E suite) grows, a single slow file
  # can't silently eat into every other file's margin, and a slow/stuck shard is isolated
  # to its own matrix entry instead of the whole suite. Record each shard's own duration
  # (real-runner-checklist.md item 3) from the job's own timing in the Actions UI.
  e2e:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Every packages/cli/test/*.e2e.test.ts file, by basename - kept in sync with
        # the real files by packages/cli/test/action-yaml.test.ts (it fails the build
        # if this list and that glob ever diverge, so a new e2e file can't go silently
        # un-sharded, and a removed one can't leave a dangling, always-skipped shard).
        shard:
          - corpus-v2
          - driver-calibration
          - guardrail-integrity
          - hosts
          - rpc-capture
          - run-suite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run e2e shard (${{ matrix.shard }}.e2e.test.ts)
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm vitest run --project cli "${SHARD}.e2e"

  # The composite action's exact-exit-code matrix (self-test.yml), called here so it
  # reports under `ci-ok` and runs once per commit.
  self-test:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/self-test.yml

  # The single required check. changes, fast and host-resolution must succeed. e2e and
  # self-test must succeed when the changes job reported a runtime change and must be
  # skipped otherwise. Any other result fails it.
  ci-ok:
    needs: [changes, fast, host-resolution, e2e, self-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check every needed job has its expected result
        env:
          RUNTIME: ${{ needs.changes.outputs.runtime }}
          CHANGES: ${{ needs.changes.result }}
          FAST: ${{ needs.fast.result }}
          HOST_RESOLUTION: ${{ needs.host-resolution.result }}
          E2E: ${{ needs.e2e.result }}
          SELF_TEST: ${{ needs.self-test.result }}
        run: |
          if [ "$RUNTIME" = "true" ]; then heavy=success; else heavy=skipped; fi
          status=0
          check() {
            echo "$1: $2 (expected $3)"
            if [ "$2" != "$3" ]; then
              echo "::error::$1 finished with $2, expected $3"
              status=1
            fi
          }
          check changes "$CHANGES" success
          check fast "$FAST" success
          check host-resolution "$HOST_RESOLUTION" success
          check e2e "$E2E" "$heavy"
          check self-test "$SELF_TEST" "$heavy"
          exit "$status"
