name: ranked-run

# ADR-010/ADR-011 (U19), Tier 1 "Ranked (held-out)": maintainer-initiated only
# (workflow_dispatch + the "ranked" environment's required reviewers — ADR-011
# "maintainers only via environment protection"). Fetches the season's held-out corpus
# from the private corpus repo (age-encrypted at rest), decrypts it INSIDE the
# container, and runs the harness as root with the corpus at mode 0400 while the
# driver/guardrail/agent run as an unprivileged uid (--agent-uid). The only published
# output is the redacted report plus its attestation — agent/guardrail logs are never
# uploaded (ADR-011 "Do not": "Put agent or guardrail logs into uploaded artifacts").
#
# ADR-023: the container is the release image built by release-image.yml. Its digest is
# resolved from results/_harness.json on the commit this workflow runs from, its
# attestation is verified, and it is pulled and run by digest. A second attestation over
# report.redacted.json records that digest and the harness commit.
#
# NOT verified live (CLAUDE.md: no docker/age/act/actionlint installed here, no network
# from this worktree) — statically authored and YAML-checked only. `age` is installed
# only inside .github/ranked/Dockerfile's image build, never on this runner's host.
# Dry-run once the org/private corpus repo/environment secrets actually exist.
on:
  workflow_dispatch:
    inputs:
      harness-ref:
        description: x402-redteam release tag/commit to run (never a branch)
        required: true
        type: string
      guardrail-repo:
        description: "org/repo of the open-source guardrail under test"
        required: true
        type: string
      guardrail-ref:
        description: Commit SHA of the guardrail to pin (never a branch)
        required: true
        type: string
      guardrail-entrypoint:
        description: Shell command (inside the guardrail checkout) that starts it
        required: true
        type: string
      guardrail-id:
        description: Stable id recorded in report.redacted.json and shown on the leaderboard
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  ranked-run:
    runs-on: ubuntu-latest
    # ADR-011: maintainer-only reviewers are configured on this environment in the
    # repo's own settings, restricted to the `main` branch (docs/seasons.md) — never
    # remove this line.
    environment: ranked
    env:
      HARNESS_REPO: x402-redteam/x402-redteam
      RANKED_IMAGE: ghcr.io/x402-redteam/x402-redteam-ranked
    steps:
      # Security review HIGH-8: harness-ref/guardrail-ref must be a 40-hex-char commit
      # SHA, or a release tag (`vMAJOR.MINOR.PATCH`) - never a branch, and never a
      # string shaped to look like a shell option when later used as a `ref:` value.
      - name: Validate harness-ref and guardrail-ref are a commit SHA or a release tag
        env:
          HARNESS_REF: ${{ inputs.harness-ref }}
          GUARDRAIL_REF: ${{ inputs.guardrail-ref }}
        run: |
          pattern='^([0-9a-f]{40}|v[0-9]+\.[0-9]+\.[0-9]+)$'
          for name in HARNESS_REF GUARDRAIL_REF; do
            value=$(eval echo "\$$name")
            if ! printf '%s' "$value" | grep -qE "$pattern"; then
              echo "::error::$name '$value' is not a 40-hex-char commit SHA or a vX.Y.Z release tag"
              exit 2
            fi
          done

      - name: Checkout the harness at a pinned ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.harness-ref }}
          path: harness
          persist-credentials: false

      # Recorded via GITHUB_ENV (read back by later steps as a plain environment
      # variable - never spliced into a run: block as a `${{ }}` expression). Works
      # whether `harness-ref` above resolved a tag or a raw commit SHA; the resolver
      # below requires the allowlisted release to name this same commit.
      - name: Resolve the checked-out harness's own commit
        run: echo "HARNESS_COMMIT=$(git -C harness rev-parse HEAD)" >> "$GITHUB_ENV"

      # The release allowlist as of the commit this workflow runs from (the `ranked`
      # environment only admits `main`).
      - name: Checkout the harness release allowlist
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: allowlist
          persist-credentials: false
          sparse-checkout: |
            results/_harness.json
            scripts/ranked/resolve-image.mjs
          sparse-checkout-cone-mode: false

      - name: Resolve the ranked image digest for harness-ref
        env:
          HARNESS_REF: ${{ inputs.harness-ref }}
          HARNESS_JSON: allowlist/results/_harness.json
        run: |
          digest="$(node allowlist/scripts/ranked/resolve-image.mjs)"
          echo "RANKED_IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"

      # The image must carry an attestation signed by this harness's release-image.yml at
      # the commit checked out above, from a run on main, on a GitHub-hosted runner. The
      # bundle is read from the registry, where release-image.yml pushed it.
      - name: Verify the ranked image attestation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: refs/heads/main
        run: |
          gh attestation verify "oci://$RANKED_IMAGE@$RANKED_IMAGE_DIGEST" \
            --bundle-from-oci \
            --repo "$HARNESS_REPO" \
            --signer-workflow "$HARNESS_REPO/.github/workflows/release-image.yml" \
            --signer-digest "$HARNESS_COMMIT" \
            --source-digest "$HARNESS_COMMIT" \
            --source-ref "$RELEASE_REF" \
            --deny-self-hosted-runners

      - name: Pull the ranked image by digest
        run: docker pull "$RANKED_IMAGE@$RANKED_IMAGE_DIGEST"

      # ADR-011 "Seasons": the held-out corpus lives in a private repo, age-encrypted
      # at rest. Parameterized per task constraints ("the org name is not decided") via
      # a repository variable rather than a hardcoded org/repo — set `HELDOUT_REPO`
      # once that private repo exists (docs/seasons.md). `HELDOUT_DEPLOY_KEY` is a
      # read-only deploy key secret, scoped to that repo only.
      - name: Checkout the held-out corpus (private repo, read-only deploy key)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.HELDOUT_REPO }}
          ssh-key: ${{ secrets.HELDOUT_DEPLOY_KEY }}
          path: heldout-encrypted
          persist-credentials: false

      - name: Checkout the guardrail under test at a pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.guardrail-repo }}
          ref: ${{ inputs.guardrail-ref }}
          path: guardrail
          persist-credentials: false

      # Security review HIGH-3/HIGH-8: every input reaches the container only via `-e`
      # (its own env), never spliced into this script's text.
      # --network none: no egress at all, including to the facilitator/RPC mocks
      # (loopback-only inside the container). --agent-uid 2001: the driver/guardrail
      # under test run unprivileged, at a uid distinct from both root and the runner's
      # own default uid (security review HIGH-4 - never 1000/1001); the harness itself
      # runs as root so the decrypted corpus can be mode 0400. --redact:
      # report.redacted.json is the only output entrypoint.sh copies to /out (HIGH-4:
      # written first to a root-only internal dir, copied out only after the harness
      # exits). AGE_KEY/SEASON_SEED are consumed entirely inside the container and
      # never written to a file this job's own filesystem can see outside it.
      - name: Decrypt the held-out corpus and run inside the container
        env:
          SEASON_SEED: ${{ secrets.SEASON_SEED }}
          AGE_KEY: ${{ secrets.AGE_KEY }}
          GUARDRAIL_ENTRYPOINT: ${{ inputs.guardrail-entrypoint }}
          GUARDRAIL_ID: ${{ inputs.guardrail-id }}
          GUARDRAIL_REPO_REF: ${{ inputs.guardrail-repo }}@${{ inputs.guardrail-ref }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          # Security re-review 1-residual: stderr (the harness's own diagnostics, a
          # crashed driver's stack trace, etc. - never scenario content given --quiet,
          # but still not something to leave in a public job log by default) goes to a
          # file on the runner's own disk, never streamed to this step's stdout/log and
          # never uploaded as an artifact.
          docker run --rm --network none \
            --user 0:0 \
            -e SEASON_SEED \
            -e AGE_KEY \
            -e GUARDRAIL_ENTRYPOINT \
            -e GUARDRAIL_ID \
            -e GUARDRAIL_REPO_REF \
            -v "$PWD/heldout-encrypted:/heldout-encrypted:ro" \
            -v "$PWD/guardrail:/guardrail:ro" \
            -v "$RUNNER_TEMP/out:/out" \
            "$RANKED_IMAGE@$RANKED_IMAGE_DIGEST" \
            --agent-uid 2001 \
            --guardrail "$GUARDRAIL_ENTRYPOINT" \
            --season-seed-env SEASON_SEED \
            --guardrail-id "$GUARDRAIL_ID" \
            --guardrail-repo-ref "$GUARDRAIL_REPO_REF" \
            --redact \
            2> "$RUNNER_TEMP/harness.stderr"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/out"

      # ADR-011 Tier 1: ONLY the redacted report is attested/published. The full
      # report (with runs[]) is kept as an encrypted artifact for disputes, never
      # uploaded here in the clear.
      - name: Attest report.redacted.json provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/out/report.redacted.json

      - name: Write the ranked image predicate
        run: |
          jq -n --arg image "$RANKED_IMAGE@$RANKED_IMAGE_DIGEST" --arg commit "$HARNESS_COMMIT" \
            '{image: $image, harness_commit: $commit}' > "$RUNNER_TEMP/ranked-image.json"

      - name: Attest which image produced report.redacted.json
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/out/report.redacted.json
          predicate-type: https://github.com/x402-redteam/x402-redteam/blob/main/docs/seasons.md#which-image-ran-this-result
          predicate-path: ${{ runner.temp }}/ranked-image.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-redacted-${{ inputs.guardrail-id }}
          path: ${{ runner.temp }}/out/report.redacted.json
          retention-days: 365
