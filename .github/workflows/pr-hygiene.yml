name: pr-hygiene

# Checks the PR title is a Conventional Commit subject (it becomes the squash-merge commit
# subject) and that non-maintainer commits carry a DCO sign-off (ADR-017 §3, §4). The logic
# is scripts/pr-hygiene.mjs; no third-party action. Runs on `pull_request`, so fork PRs get
# a read-only token and no secrets. The script is checked out from the PR's base commit, so a
# PR cannot change the check that judges it.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-hygiene-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout of scripts/pr-hygiene.mjs
      pull-requests: read # list the PR's commits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Check title and sign-off
        run: node scripts/pr-hygiene.mjs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
          # Comma-separated GitHub logins exempt from the sign-off check.
          MAINTAINERS: lnhunt11
