name: "x402-redteam"
description: "Red-team an x402-paying agent against a corpus of hostile payment scenarios, and upload the findings as SARIF."
author: "x402-redteam contributors"

inputs:
  agent:
    description: "Shell command that starts the agent under test (run with the workspace as its working directory)."
    required: true
  chains:
    description: "Comma-separated chains to run."
    required: false
    default: "evm,svm"
  corpus:
    description: "Path to a corpus directory. Defaults to the harness's bundled corpus/."
    required: false
    default: "${{ github.action_path }}/corpus"
  repeat:
    description: "Attempts per scenario x chain."
    required: false
    default: "1"
  timeout:
    description: "Per-run timeout in seconds, counted from the agent's first request."
    required: false
    default: "60"
  startup-timeout:
    description: "Seconds an agent may take to make its first request before the run is killed."
    required: false
    default: "120"
  fail-on:
    description: "Minimum severity that fails the run (low|medium|high|critical)."
    required: false
    default: "low"
  agent-id:
    description: "Agent id recorded in the report."
    required: false
    default: "${{ github.repository }}"
  guardrail-id:
    description: "Guardrail id recorded in the report."
    required: false
    default: "unknown"
  upload-sarif:
    description: "Upload report.sarif to GitHub code scanning."
    required: false
    default: "true"
  out:
    description: "Output directory, relative to the workspace."
    required: false
    default: "x402-redteam-out"
  pass-env:
    description: "Comma-separated extra env var names to pass through to the agent, forwarded as --pass-env. Never put a secret's *value* here - name the env var instead (e.g. ANTHROPIC_API_KEY) and set it on the job/step as usual; this input only controls which names the harness lets through its otherwise-clean agent environment."
    required: false
    default: ""

outputs:
  report-json:
    description: "Path (relative to the workspace) to the generated report.json."
    value: ${{ steps.run.outputs.report-json }}
  pass-rate:
    description: "Overall run pass rate, 0-1."
    value: ${{ steps.run.outputs.pass-rate }}
  unauthorized-usd:
    description: "Total unauthorized USD across the run."
    value: ${{ steps.run.outputs.unauthorized-usd }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Enable corepack
      shell: bash
      run: corepack enable

    - name: Install harness dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm install --frozen-lockfile

    # Invokes the CLI's bin script directly (rather than `pnpm -C <action_path>
    # exec x402-redteam run`) because `pnpm -C`/`--dir` also redirects the cwd
    # of the command it execs, which would make `inputs.agent` resolve
    # relative paths against this action's own checkout instead of the
    # caller's repo. Running `node <action_path>/.../bin/x402-redteam.mjs`
    # with the step's `working-directory` set to the workspace keeps the
    # agent's own cwd correct; the action's node_modules/.bin is appended to
    # PATH so a plain `tsx ...`-style agent command (as in this repo's own
    # examples/agents) still resolves without the caller vendoring tsx.
    #
    # U12 (Review 1, M7): every `inputs.*` value is passed through `env:` and read back
    # as a quoted shell variable ("$AGENT_CMD", not `${{ inputs.agent }}`) instead of
    # being interpolated directly into the `run:` script text. `${{ }}` in a `run:` block
    # is substituted by GitHub Actions *before* the shell ever sees the script, so an
    # unquoted-at-that-point `inputs.agent` (or any other input) containing a `"` or a
    # backtick would splice arbitrary shell into this step rather than merely becoming
    # one (quoted) argument - env vars close that hole because the shell only ever
    # substitutes them as data, after the script text is fixed. The report-path values
    # handed to `node -e` are passed the same way (`process.env.REPORT_PATH`, not string
    # concatenation into the `-e` source), for the same reason one level down.
    - name: Run x402-redteam
      id: run
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        ACTION_PATH: ${{ github.action_path }}
        AGENT_CMD: ${{ inputs.agent }}
        CHAINS: ${{ inputs.chains }}
        CORPUS: ${{ inputs.corpus }}
        REPEAT: ${{ inputs.repeat }}
        TIMEOUT: ${{ inputs.timeout }}
        STARTUP_TIMEOUT: ${{ inputs.startup-timeout }}
        FAIL_ON: ${{ inputs.fail-on }}
        AGENT_ID: ${{ inputs.agent-id }}
        GUARDRAIL_ID: ${{ inputs.guardrail-id }}
        OUT_DIR: ${{ inputs.out }}
        PASS_ENV: ${{ inputs.pass-env }}
      run: |
        set +e
        export PATH="$PATH:$ACTION_PATH/node_modules/.bin"
        pass_env_args=()
        if [ -n "$PASS_ENV" ]; then
          pass_env_args=(--pass-env "$PASS_ENV")
        fi
        node "$ACTION_PATH/packages/cli/bin/x402-redteam.mjs" run \
          --agent "$AGENT_CMD" \
          --chains "$CHAINS" \
          --corpus "$CORPUS" \
          --repeat "$REPEAT" \
          --timeout "$TIMEOUT" \
          --startup-timeout "$STARTUP_TIMEOUT" \
          --fail-on "$FAIL_ON" \
          --agent-id "$AGENT_ID" \
          --guardrail-id "$GUARDRAIL_ID" \
          --out "$OUT_DIR" \
          "${pass_env_args[@]}"
        code=$?

        report="$OUT_DIR/report.json"
        echo "report-json=$report" >> "$GITHUB_OUTPUT"
        if [ -f "$report" ]; then
          pass_rate=$(REPORT_PATH="$report" node -e "console.log(JSON.parse(require('node:fs').readFileSync(process.env.REPORT_PATH,'utf8')).summary.pass_rate)")
          unauthorized=$(REPORT_PATH="$report" node -e "console.log(JSON.parse(require('node:fs').readFileSync(process.env.REPORT_PATH,'utf8')).summary.unauthorized_usd)")
        else
          pass_rate=0
          unauthorized=0
        fi
        echo "pass-rate=$pass_rate" >> "$GITHUB_OUTPUT"
        echo "unauthorized-usd=$unauthorized" >> "$GITHUB_OUTPUT"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        exit 0

    # Needs `permissions: security-events: write` on the *caller's* job or workflow -
    # a composite action (this file) cannot grant its own permissions, only use what the
    # caller's GITHUB_TOKEN already has. Without it, this step fails on a private repo or
    # a restrictive org default (README "Integration contract" documents this).
    - name: Upload SARIF
      if: ${{ inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.out }}/report.sarif
        category: x402-redteam

    - name: Upload report artifact
      uses: actions/upload-artifact@v4
      with:
        name: x402-redteam-report
        path: ${{ inputs.out }}

    - name: Append report to step summary
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        OUT_DIR: ${{ inputs.out }}
      run: cat "$OUT_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Exit with the harness result
      shell: bash
      env:
        EXIT_CODE: ${{ steps.run.outputs.exit-code }}
      run: exit "$EXIT_CODE"
